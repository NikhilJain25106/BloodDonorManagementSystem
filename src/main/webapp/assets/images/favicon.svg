<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f43f5e" />
            <stop offset="50%" stop-color="#e11d48" />
            <stop offset="100%" stop-color="#9f1239" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#e11d48" flood-opacity="0.4"/>
        </filter>
    </defs>
    <!-- Background Circle -->
    <rect width="64" height="64" rx="16" fill="#0f172a"/>
    <!-- Blood Droplet -->
    <path d="M32 10 C32 10 18 28 18 39 C18 47.8 24.3 55 32 55 C39.7 55 46 47.8 46 39 C46 28 32 10 32 10 Z" fill="url(#dropGrad)" filter="url(#shadow)"/>
    <!-- Inner shine highlight -->
    <ellipse cx="26" cy="35" rx="4" ry="7" transform="rotate(-25 26 35)" fill="#ffffff" opacity="0.35"/>
    <!-- Medical Cross in Droplet -->
    <path d="M30 36 H34 V42 H30 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M27 38 H37 V40 H27 Z" fill="#ffffff" opacity="0.9"/>
</svg>

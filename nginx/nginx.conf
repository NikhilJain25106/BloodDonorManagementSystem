# =========================================================================
# LifeDrop - Production Nginx Reverse Proxy & Load Balancer Configuration
# Handles SSL Termination, Rate Limiting, Static Asset Caching & Balancing
# =========================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Rate limiting zones to prevent brute force and DDoS attacks
    limit_req_zone $binary_remote_addr zone=search_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=register_limit:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

    # Upstream cluster of LifeDrop application instances
    upstream lifedrop_app_cluster {
        least_conn; # Distribute load to instances with lowest active connections
        server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8081 max_fails=3 fail_timeout=10s backup;
        keepalive 32;
    }

    # HTTP Redirect to HTTPS
    server {
        listen 80;
        server_name lifedrop.org www.lifedrop.org;
        return 301 https://$host$request_uri;
    }

    # Primary HTTPS Server
    server {
        listen 443 ssl http2;
        server_name lifedrop.org www.lifedrop.org;

        # TLS / SSL Configuration
        ssl_certificate /etc/letsencrypt/live/lifedrop.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lifedrop.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Emergency Search endpoint rate limiting
        location /searchDonors {
            limit_req zone=search_limit burst=20 nodelay;
            proxy_pass http://lifedrop_app_cluster;
            include proxy_params;
        }

        # Donor registration endpoint rate limiting
        location /register {
            limit_req zone=register_limit burst=5;
            proxy_pass http://lifedrop_app_cluster;
            include proxy_params;
        }

        # Admin login brute-force mitigation
        location /adminLogin {
            limit_req zone=login_limit burst=10 nodelay;
            proxy_pass http://lifedrop_app_cluster;
            include proxy_params;
        }

        # Default proxy pass for general application routes
        location / {
            proxy_pass http://lifedrop_app_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
}
